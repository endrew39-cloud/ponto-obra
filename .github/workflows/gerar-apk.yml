name: Gerar APK Ponto Obra
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pegar código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Baixar arquivos do Gradle automaticamente
        run: |
          wget -q https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Compilar e gerar APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Salvar APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: APK-Pronto
          path: app/build/outputs/apk/debug/*.apk
